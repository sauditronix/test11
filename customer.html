<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - NexusIoT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">NexusIoT - Dashboard</div>
            <ul>
                <li><a href="index.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="dashboard">
            <h2>Your Devices</h2>
            <div id="device-grid" class="grid-container">
                <!-- Device cards will be dynamically added here -->
            </div>
        </section>

        <section id="device-detail-view" class="hidden">
            <h2 id="device-detail-name"></h2>
            <div class="chart-placeholder">
                <p>Telemetry data will be displayed here as a line chart.</p>
            </div>
            <button id="back-to-grid" class="btn">Back to Grid</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 NexusIoT. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
